<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="shortcut icon" type="image/png" href="/favicon.png" />
  <title>GitHub 文件加速</title>
  <style>
    body {
      background-color: #282c34;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
        "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .flex {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .block {
      display: block;
    }

    /* ✅ 输入框宽度调整为350px */
    .url {
      border: none;
      border-bottom: 1px solid #61dafb;
      background: transparent;
      color: #eee;
      font-size: 1.2em;
      width: 350px;
      max-width: 90vw; /* 移动端适配 */
      padding: 10px 0;
      text-align: center;
      outline: none;
      box-sizing: border-box;
    }

    .url::placeholder {
      color: #aaa;
    }

    .bar {
      position: relative;
      display: block;
      width: 350px;
      max-width: 90vw;
    }

    .bar:before,
    .bar:after {
      content: '';
      height: 2px;
      width: 0;
      bottom: 0px;
      position: absolute;
      background: #61dafb;
      transition: 0.2s ease all;
    }

    .bar:before {
      left: 50%;
    }

    .bar:after {
      right: 50%;
    }

    .url:focus~.bar:before,
    .url:focus~.bar:after {
      width: 50%;
    }

    .btn {
      background-color: #61dafb;
      color: #282c34;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 8px 0;
      width: 160px;
      margin: 15px 10px;
      font-size: 1em;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    h1 {
      color: #eee;
      text-align: center;
      margin-bottom: 50px;
      font-size: 1.8em;
    }

    #copySuccessNotification {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(97, 218, 251, 0.9);
      color: #282c34;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
    }

    /* ✅ 响应式：优化竖屏手机显示 */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.4em;
        margin-bottom: 30px;
      }

      .url {
        width: 90vw;
        font-size: 1em;
      }

      .bar {
        width: 90vw;
      }

      .btn {
        width: 120px;
        font-size: 0.9em;
      }

      .btn-container {
        flex-direction: column;
        gap: 10px;
      }

      body {
        padding: 20px;
      }
    }
  </style>

  <script>
    function toSubmit(e) {
      e.preventDefault();
      const url = location.href.substr(0, location.href.lastIndexOf('/') + 1) + document.getElementsByName('q')[0].value;
      window.open(url);
      return false;
    }

    function copyLink() {
      const url = location.href.substr(0, location.href.lastIndexOf('/') + 1) + document.getElementsByName('q')[0].value;
      const notification = document.getElementById('copySuccessNotification');
      navigator.clipboard.writeText(url)
        .then(() => {
          notification.style.opacity = '1';
          notification.style.visibility = 'visible';
          setTimeout(() => {
            notification.style.opacity = '0';
            notification.style.visibility = 'hidden';
          }, 1500);
        })
        .catch(err => {
          alert('复制链接失败，请手动复制。');
        });
    }
  </script>
</head>

<body class="flex">
  <h1><a href="https://github.com/hunshcn/gh-proxy" style="color: inherit; text-decoration: none;" target="_blank">GitHub 文件加速</a></h1>

  <form action="./" method="get" style="padding-bottom: 40px" target="_blank" class="flex" onsubmit="toSubmit(event)">
    <label class="block" style="width: fit-content">
      <input class="block url" name="q" type="text" placeholder="键入Github文件链接"
        pattern="^((https|http):\/\/)?(github\.com\/.+?\/.+?\/(?:releases|archive|blob|raw|suites)|((?:raw|gist)\.(?:githubusercontent|github)\.com))\/.+$"
        required="">
      <div class="bar"></div>
    </label>

    <div class="btn-container">
      <input class="block btn" type="submit" value="下载">
      <button class="block btn" type="button" onclick="copyLink()">复制链接</button>
    </div>
  </form>

  <p style="margin-top: 50px; color: #aaa; text-align: center">
    项目地址：<a href="https://github.com/mlabalabala/ghproxy" target="_blank"
      style="color: #61dafb; text-decoration: none;">https://github.com/mlabalabala/ghproxy</a>
  </p>
  <p style="color: #aaa; font-size: xx-small; text-align: center;">Tips：点击标题跳转源项目~~~</p>

  <div id="copySuccessNotification">复制成功！</div>
</body>
</html>
