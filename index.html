<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #282c34;
            /* 深色背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
                "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .flex {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .block {
            display: block;
        }

        .url {
            border: none;
            border-bottom: 1px solid #61dafb;
            /* 下划线颜色 */
            background: transparent;
            color: #eee;
            /* 输入文本颜色 */
            font-size: 1.2em;
            width: 500px;
            padding: 10px 0;
            text-align: center;
            outline: none;
        }

        .url::placeholder {
            color: #aaa;
            /* 占位符颜色 */
        }

        .bar {
            position: relative;
            display: block;
            width: 500px;
        }

        .bar:before,
        .bar:after {
            content: '';
            height: 2px;
            width: 0;
            bottom: 0px;
            position: absolute;
            background: #61dafb;
            transition: 0.2s ease all;
            -moz-transition: 0.2s ease all;
            -webkit-transition: 0.2s ease all;
        }

        .bar:before {
            left: 50%;
        }

        .bar:after {
            right: 50%;
        }

        .url:focus~.bar:before,
        .url:focus~.bar:after {
            width: 50%;
        }

        .btn {
            background-color: #61dafb;
            /* 按钮背景色 */
            color: #282c34;
            /* 按钮文字颜色 */
            border: none;
            border-radius: 2px;
            cursor: pointer;
            padding: 5px;
            width: 160px;
            margin: 30px 10px;
            /* 增加一些左右间距 */
        }

        .btn-container {
            display: flex;
            /* 使用 flex 布局使按钮水平排列 */
            justify-content: center;
            /* 水平居中 */
            align-items: center;
            /* 垂直居中 */
            margin: 30px 0;
        }

        h1 {
            color: #eee;
            /* 标题颜色 */
        }

        #copySuccessNotification {
            position: fixed; /* 固定定位 */
            bottom: 20px; /* 距离底部20px */
            left: 50%; /* 水平居中 */
            transform: translateX(-50%); /* 精确居中 */
            background-color: rgba(97, 218, 251, 0.9); /* 半透明背景，与主题色一致 */
            color: #282c34; /* 文字颜色 */
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000; /* 确保在最上层 */
            opacity: 0; /* 初始隐藏 */
            visibility: hidden; /* 初始隐藏 */
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out; /* 过渡动画 */
        }
    </style>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <script>
        function toSubmit(e) {
            e.preventDefault();
            const url = location.href.substr(0, location.href.lastIndexOf('/') + 1) + document.getElementsByName('q')[0].value;
            window.open(url);
            return false;
        }

        function copyLink() {
            const url = location.href.substr(0, location.href.lastIndexOf('/') + 1) + document.getElementsByName('q')[0].value;
            const notification = document.getElementById('copySuccessNotification');

            navigator.clipboard.writeText(url)
                .then(() => {
                    console.info('链接已复制到剪贴板！');
                    notification.style.opacity = '1';
                    notification.style.visibility = 'visible';
                    setTimeout(() => {
                        notification.style.opacity = '0';
                        notification.style.visibility = 'hidden';
                    }, 1500);
                })
                .catch(err => {
                    console.error('复制链接失败: ', err);
                    alert('复制链接失败，请手动复制。');
                });
        }
    </script>
    <title>GitHub 文件加速</title>
</head>

<body class="flex">
    <h1 style="margin-bottom: 50px"><a href="https://github.com/hunshcn/gh-proxy" style="color: inherit; text-decoration: none;" target="_blank">GitHub 文件加速</a></h1>
    <form action="./" method="get" style="padding-bottom: 40px" target="_blank" class="flex" onsubmit="toSubmit(event)">
        <label class="block" style="width: fit-content">
            <input class="block url" name="q" type="text" placeholder="键入Github文件链接"
                pattern="^((https|http):\/\/)?(github\.com\/.+?\/.+?\/(?:releases|archive|blob|raw|suites)|((?:raw|gist)\.(?:githubusercontent|github)\.com))\/.+$"
                required="">
            <div class="bar"></div>
        </label>
        <div class="btn-container">
            <input class="block btn" type="submit" value="下载">
            <button class="block btn" type="button" onclick="copyLink()">复制链接</button>
        </div>
    </form>

    <p style="margin-top: 50px; color: #aaa; text-align: center">
        项目地址：<a href="https://github.com/mlabalabala/ghproxy" target="_blank" style="color: #61dafb; text-decoration: none;">https://github.com/mlabalabala/ghproxy</a>
        <p style="color: #aaa;font-size: xx-small;">Tips：点击标题跳转源项目~~~</p>
    </p>

    <div id="copySuccessNotification">复制成功！</div>
</body>

</html>
